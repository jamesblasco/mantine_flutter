name: Update Changelog

on:
  push:
    tags:
      - 'mantine-v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: .cliff.toml
          args: --verbose --output packages/mantine/CHANGELOG.md

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update CHANGELOG for ${{ github.ref_name }}"
          branch: changelog/${{ github.ref_name }}
          title: "chore: update CHANGELOG for ${{ github.ref_name }}"
          body: |
            Auto-generated changelog update for release `${{ github.ref_name }}`.

            Review and merge before publishing to pub.dev.
          labels: changelog
          delete-branch: true
